# EnlaceSeguro - levanta todo con:  docker compose up --build -d

# Configuracion comun de los 3 sandboxes (ancla YAML para no repetirla)
x-sandbox: &sandbox
  build: ./sandbox
  user: pwuser              # usuario sin privilegios
  read_only: true           # el contenedor no puede modificar sus archivos
  tmpfs:                    # unicas carpetas escribibles; se borran al reiniciar
    - /tmp
    - /home/pwuser
  mem_limit: 1g
  cpus: 1.0
  shm_size: 1gb             # sin esto Chromium falla en paginas pesadas
  cap_drop: [ALL]           # sin permisos especiales del sistema
  security_opt:
    - no-new-privileges:true
  restart: always           # si el sandbox se cierra, Docker lo levanta limpio
  # Cada sandbox tiene su propia red (ver abajo): no esta en red_interna, asi que no
  # puede ver la base de datos, y tampoco puede ver a los otros sandboxes.

services:
  db:
    image: postgres:16
    environment:            # solo sus datos; no recibe las llaves ni el secreto JWT
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:            # la API espera a que la base de datos este lista
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [red_interna]

  api:
    build: ./api
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"         # en la semana 4 el celular se conecta por aqui
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Ve la base de datos y a cada sandbox. Las peticiones que llegan DESDE un sandbox
    # se rechazan con 403 en la propia API (api/src/bloqueoSandboxes.ts).
    networks: [red_interna, red_sandbox1, red_sandbox2, red_sandbox3]

  sandbox1:
    <<: *sandbox
    networks: [red_sandbox1]
    ports:
      - "127.0.0.1:9001:9000"   # SOLO para probar desde tu PC; quitar en la semana 4
  sandbox2:
    <<: *sandbox
    networks: [red_sandbox2]
  sandbox3:
    <<: *sandbox
    networks: [red_sandbox3]

networks:
  red_interna:
    internal: true          # sin salida a internet: solo api y db
  red_sandbox1: {}          # con salida a internet para abrir los enlaces
  red_sandbox2: {}
  red_sandbox3: {}

volumes:
  datos_db:
